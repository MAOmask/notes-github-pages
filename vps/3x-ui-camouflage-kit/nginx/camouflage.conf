# LightNVR 伪装站 + 3x-ui 面板隐藏入口 (Cloudflare → :8443)
server {
    listen 0.0.0.0:8443 ssl http2;
    server_name es.000486000.xyz;

    # Cloudflare Origin CA 证书
    ssl_certificate /etc/ssl/certs/es.000486000.xyz.pem;
    ssl_certificate_key /etc/ssl/private/es.000486000.xyz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # 🔒 3x-ui 面板隐藏入口 (三层防线)
    # 第一层：Cloudflare WAF IP白名单 (iptables)
    # 第二层：nginx basic auth
    # 第三层：3x-ui 面板自身认证
    location /kjJLZrSlkDxHsHwl4RoD7I/ {
        # nginx basic auth
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd_xui;

        proxy_pass https://127.0.0.1:9266;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # 🏠 LightNVR 伪装网站 (根路径)
    location / {
        proxy_pass http://127.0.0.1:20552;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
